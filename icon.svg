<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset=".6" stop-color="#1e1b4b"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".55" r=".55"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".55"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
  <clipPath id="house"><path d="M512 256 L796 486 L796 800 Q796 820 776 820 L248 820 Q228 820 228 800 L228 486 Z"/></clipPath>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/><rect width="1024" height="1024" fill="url(#glow)"/>
 <!-- área del gráfico recortada con forma de casa -->
 <g clip-path="url(#house)">
  <rect x="200" y="240" width="620" height="600" fill="#ffffff" opacity=".06"/>
  <path d="M200 760 L330 690 L430 720 L560 560 L660 590 L830 400 L830 840 L200 840 Z" fill="url(#area)"/>
  <g stroke="#ffffff" stroke-opacity=".08" stroke-width="4"><line x1="200" y1="560" x2="830" y2="560"/><line x1="200" y1="660" x2="830" y2="660"/><line x1="200" y1="760" x2="830" y2="760"/></g>
 </g>
 <path d="M512 256 L796 486 L796 800 Q796 820 776 820 L248 820 Q228 820 228 800 L228 486 Z" fill="none" stroke="#e0f2fe" stroke-width="30" stroke-linejoin="round"/>
 <path d="M200 760 L330 690 L430 720 L560 560 L660 590 L830 400" fill="none" stroke="url(#ln)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>
 <circle cx="830" cy="400" r="34" fill="#facc15" filter="url(#gl)"/>
 <circle cx="830" cy="400" r="14" fill="#fff"/>
</svg>
