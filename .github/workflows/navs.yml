name: Actualizar valores liquidativos e IPC

on:
  schedule:
    - cron: "37 6 * * 1-6"   # por la mañana (hora UTC), recoge el precio del día anterior
    - cron: "47 19 * * 1-5"  # por la tarde, por si ya se ha publicado el del día
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: navs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar precios
        run: python scripts/update_navs.py

      - name: Descargar IPC (INE)
        run: python scripts/update_ipc.py
        continue-on-error: true

      - name: Guardar cambios
        run: |
          git add navs.json ipc.json 2>/dev/null || git add navs.json
          if git diff --cached --quiet; then
            echo "Sin datos nuevos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos $(date -u +%F)"
          git push
