<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patrimonio</title>
<meta name="description" content="Control de cuentas, bolsas de ahorro, objetivo casa e ingresos extra">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimonio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f6f5;--card:#ffffff;--text:#14201e;--muted:#5b6866;--line:#e2e7e5;
  --accent:#0f766e;--accent-2:#0b5a54;--accent-soft:#dcefeb;--on-accent:#ffffff;
  --warn:#9a5306;--warn-soft:#fcefd9;--bad:#b42318;--bad-soft:#fde4e1;--ok:#157f3d;--ok-soft:#dcf3e3;
  --b-operativo:#8a97a8;--b-emergencia:#d97706;--b-casa:#0f766e;--b-largo:#4f46e5;--b-total:#14201e;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1312;--card:#152020;--text:#e6eeec;--muted:#98a9a5;--line:#25322f;
    --accent:#2bb3a3;--accent-2:#5fd0c2;--accent-soft:#143a35;--on-accent:#04201c;
    --warn:#f0a94b;--warn-soft:#382811;--bad:#f2867a;--bad-soft:#3b1b18;--ok:#5bd08a;--ok-soft:#14321f;
    --b-operativo:#94a3b8;--b-emergencia:#f59e0b;--b-casa:#2bb3a3;--b-largo:#8b93fa;--b-total:#e6eeec;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1312;--card:#152020;--text:#e6eeec;--muted:#98a9a5;--line:#25322f;
  --accent:#2bb3a3;--accent-2:#5fd0c2;--accent-soft:#143a35;--on-accent:#04201c;
  --warn:#f0a94b;--warn-soft:#382811;--bad:#f2867a;--bad-soft:#3b1b18;--ok:#5bd08a;--ok-soft:#14321f;
  --b-operativo:#94a3b8;--b-emergencia:#f59e0b;--b-casa:#2bb3a3;--b-largo:#8b93fa;--b-total:#e6eeec;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom));overflow-x:hidden}
.num,.big,.kpi b{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header h1{font-size:21px;margin:0;letter-spacing:-.015em}
header .sub{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding:4px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:16px;color:var(--text);margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.card h2 .em{margin-right:6px}
.card h3{font-size:16px;margin:0 0 4px}
.big{font-size:34px;font-weight:750;letter-spacing:-.025em;line-height:1.1}
.mid{font-size:22px;font-weight:700;letter-spacing:-.015em}
.muted{color:var(--muted)}.small{font-size:13px}
.up{color:var(--ok)}.down{color:var(--bad)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:14px 0 12px}
.stack i{display:block;height:100%}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>span:first-child{min-width:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;margin-bottom:10px;font-size:14.5px;border-left:4px solid}
.alert .ic{font-size:20px;line-height:1.2;flex:none}
.alert .bd{flex:1;min-width:0}
.alert .go{margin-top:8px;display:inline-block;border:0;background:var(--card);color:var(--accent-2);font:inherit;font-weight:650;font-size:13.5px;padding:7px 12px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:650;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btnrow .btn{flex:1}
.acc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;color:inherit;font:inherit;text-align:left}
.acc:first-of-type{border-top:0}
.acc .meta{font-size:13px;color:var(--muted)}
.acc .r{text-align:right;white-space:nowrap}
.bucket-h{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.field{display:block;margin:0 0 10px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;padding:10px 0;outline:none}
.inp textarea{min-height:70px;resize:vertical}
.inp em{font-style:normal;color:var(--muted);margin-left:6px;font-size:14px}
.inp:focus-within{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:370px){.grid2{grid-template-columns:1fr}}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:8px 0;cursor:pointer}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .sw{flex:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;margin-top:1px}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+.sw{background:var(--accent)}
.toggle input:checked+.sw::after{transform:translateX(18px)}
.toggle input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.toggle .tl small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);vertical-align:middle}
.tag.validando{background:var(--warn-soft);color:var(--warn)}
.tag.marcha{background:var(--ok-soft);color:var(--ok)}
.tag.descartado{background:var(--bad-soft);color:var(--bad)}
.tag.idea{background:var(--accent-soft);color:var(--accent-2)}
.note{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px}
.chart .hl{stroke:var(--warn);stroke-dasharray:5 4;stroke-width:1.5}
.chart .hlt{fill:var(--warn);font-weight:600}
.chart .now{stroke:var(--muted);stroke-dasharray:2 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 4px}
table.cmp td{padding:8px 4px;border-top:1px solid var(--line)}
table.cmp td:not(:first-child),table.cmp th:not(:first-child){text-align:right}
table.cmp tr.cur td{font-weight:700;color:var(--accent-2)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:18px;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--muted)}
.range{width:100%;accent-color:var(--accent);margin:6px 0 2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.check .t{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.addline{display:flex;gap:8px;margin-top:8px}
.addline .inp{flex:1}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:4px 0;cursor:pointer}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:23px;height:23px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 14px;font-size:19px}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:20px}}
.hero{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--on-accent);border:0}
.hero .hello{font-size:15px;opacity:.9;margin:0 0 4px}
.hero .msg{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 12px;letter-spacing:-.01em}
.hero .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--on-accent);border-radius:99px}
.hero .foot{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:6px}
.welcome{border:1px dashed var(--accent);background:var(--accent-soft)}
.welcome ol{margin:8px 0 10px;padding-left:20px}
.welcome li{margin:4px 0}
.help{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
table.cmp td{white-space:nowrap}
:root{--b-gastos:#c2410c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b-gastos:#f08a4b}}
:root[data-theme="dark"]{--b-gastos:#f08a4b}
.split-bar{position:relative;height:46px;display:flex;margin:22px 4px 16px;touch-action:none;user-select:none;-webkit-user-select:none}
.split-bar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;overflow:hidden;white-space:nowrap;transition:width .05s}
.split-bar .seg:first-child{border-radius:12px 0 0 12px}
.split-bar .seg:nth-child(3){border-radius:0 12px 12px 0}
.split-bar .hdl{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--card);border:3px solid var(--text);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:ew-resize;touch-action:none;padding:0;z-index:2}
.split-bar .hdl::before{content:"";position:absolute;inset:-12px}
.split-bar .hdl::after{content:"";position:absolute;left:50%;top:50%;width:2px;height:10px;margin:-5px 0 0 -1px;background:var(--text);border-radius:1px}
.split-bar .hdl:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend-row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.legend-row i{width:14px;height:14px;border-radius:4px}
.legend-row small{display:block;color:var(--muted);font-size:12.5px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mnav h2{margin:0;font-size:19px;text-transform:capitalize}
.mnav .iconbtn{width:36px;height:36px}
.delta-big{font-size:30px;font-weight:750;letter-spacing:-.02em}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
body.locked #lock{display:flex}
body.locked main,body.locked header.top,body.locked nav.tabs,body.locked #modal{visibility:hidden}
#lock .logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:34px}
#lock .pin{width:180px;text-align:center;font-size:24px;letter-spacing:.4em;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--text)}
#lock .err{color:var(--bad);font-size:14px;min-height:18px}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:16px 4px 0}
.split{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div><h1>Patrimonio</h1><div class="sub" id="subtitle"></div></div>
  <button class="iconbtn" data-action="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="8" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="5" rx="1.5"/><rect x="4" y="15" width="6.5" height="5" rx="1.5"/><rect x="13.5" y="12" width="6.5" height="8" rx="1.5"/></svg>Resumen</button>
  <button data-tab="cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg>Cuentas</button>
  <button data-tab="casa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>Casa</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 4v16h16"/><path d="M7.5 15l4-4.5 3 3L20 7"/></svg>Plan</button>
  <button data-tab="extras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>Extras</button>
</nav>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="lock" aria-live="polite">
  <div class="logo">🔒</div>
  <h2 style="margin:0">Patrimonio</h2>
  <p class="muted" style="margin:0">Desbloquea para ver tus datos</p>
  <button class="btn" id="lock-bio" style="min-width:220px">Desbloquear con Face ID</button>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:6px">
    <input class="pin" id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="PIN" autocomplete="off" aria-label="PIN">
    <button class="btn ghost" id="lock-pin-go">Entrar con PIN</button>
  </div>
  <div class="err" id="lock-err"></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
const KEY = 'patrimonio.v1';
const TAB_KEY = 'patrimonio.tab';

/* ---------- utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);
const fin = n => (typeof n === 'number' && isFinite(n)) ? n : 0;
const eur = (n, d = 0) => fin(n).toLocaleString('es-ES', {style:'currency', currency:'EUR', minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:'always'});
const pct = (n, d = 1) => fin(n).toLocaleString('es-ES', {minimumFractionDigits:d, maximumFractionDigits:d}) + ' %';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthLabel = d => d.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
const shortMonth = d => d.toLocaleDateString('es-ES', {month:'short', year:'2-digit'}).replace('.', '');
const dateFmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});
const compact = v => {
  const a = Math.abs(v);
  if (a >= 1000) return (v/1000).toLocaleString('es-ES', {maximumFractionDigits: a >= 10000 ? 0 : 1}) + 'k';
  return Math.abs(v) < 100 ? v.toLocaleString('es-ES', {maximumFractionDigits: 2}) : Math.round(v).toString();
};
const durText = n => {
  const y = Math.floor(n/12), m = n % 12;
  const parts = [];
  if (y) parts.push(y + (y === 1 ? ' año' : ' años'));
  if (m) parts.push(m + (m === 1 ? ' mes' : ' meses'));
  return parts.join(' y ') || 'este mes';
};
const addMonths = n => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + n, 1); };

const BK = ['operativo', 'emergencia', 'casa', 'largo'];
const BUCKETS = {
  operativo: {label:'Día a día', em:'💳', desc:'Para recibos y gastos del mes. Aquí no conviene acumular de más.'},
  emergencia:{label:'Emergencias', em:'🛟', desc:'Tu colchón por si pasa algo: avería, paro, imprevisto.'},
  casa:      {label:'Para la casa', em:'🏠', desc:'Entrada y gastos de la vivienda. Seguro y disponible.'},
  largo:     {label:'Inversión', em:'📈', desc:'Dinero que no vas a tocar en 10 años o más.'}
};
const FALLBACK_RATE = {operativo:0, emergencia:2, casa:2, largo:7};
const TYPES = {corriente:'Cuenta corriente', remunerada:'Cuenta remunerada', monetario:'Fondo monetario', indexado:'Fondo indexado', otro:'Otro'};
const STATUS = {idea:'Idea', validando:'Validando', marcha:'En marcha', pausa:'En pausa', descartado:'Descartado'};

/* ---------- estado ---------- */
function makeSnapshot(s, date) {
  const balances = {}, byBucket = {operativo:0, emergencia:0, casa:0, largo:0};
  let total = 0;
  for (const a of s.accounts) { balances[a.id] = a.balance; byBucket[a.bucket] = (byBucket[a.bucket]||0) + a.balance; total += a.balance; }
  return {date, balances, byBucket, total};
}
function defaults() {
  const s = {
    version: 2,
    accounts: [

function fifoCost(a, units, date) {
  // Coste fiscal (FIFO) de vender 'units' participaciones en 'date', según las compras apuntadas
  const lots = [...(a.lots || [])].filter(l => l.date <= date).sort((x, y) => x.date.localeCompare(y.date));
  let skip = (a.sales || []).filter(x => x.date <= date).reduce((s, x) => s + x.units, 0);
  let left = units, cost = 0;
  for (const l of lots) {
    let avail = l.units;
    if (skip > 0) { const t = Math.min(skip, avail); skip -= t; avail -= t; }
    if (avail <= 0) continue;
    const take = Math.min(left, avail); cost += l.amount * take / l.units; left -= take;
    if (left <= 1e-9) break;
  }
  if (left > 1e-6) {
    const avg = a.invested != null && a.units > 0 ? a.invested / a.units : null;
    if (avg == null) return null;
    cost += avg * left;
  }
  return cost;
}
function lotUnits(isin, date, amount) { const at = navAt(isin, date); return at ? Math.round(amount / at[1] * 10000) / 10000 : 0; }
function fundPerf(a) {
  const lots = [...(a.lots || [])].sort((x, y) => x.date.localeCompare(y.date));
  const h = fundHist(a.isin);
  if (!lots.length || !h.length) return null;
  const first = lots[0].date;
  let pts = h.filter(([d]) => d >= first);
  if (!pts.length) pts = [h[h.length - 1]];
  const stepN = Math.max(1, Math.floor(pts.length / 100));
  pts = pts.filter((_, i) => i % stepN === 0 || i === pts.length - 1);
  const ev = [...lots.map(l => ({date: l.date, u: l.units, c: l.amount})), ...(a.sales || []).map(x => ({date: x.date, u: -x.units, c: -(x.cost || 0)}))].sort((x, y) => x.date.localeCompare(y.date));
  let ei = 0, u = 0, put = 0;
  const rows = pts.map(([d, nav]) => {
    while (ei < ev.length && ev[ei].date <= d) { u += ev[ei].u; put += ev[ei].c; ei++; }
    return {d, value: Math.max(0, u) * nav, put: Math.max(0, put)};
  });
  const nav = h[h.length - 1][1];
  const totU = ev.reduce((s, e) => s + e.u, 0), totPut = Math.max(0, ev.reduce((s, e) => s + e.c, 0));
  const value = totU * nav;
  const per = lots.map(l => ({...l, now: l.units * nav, gain: l.units * nav - l.amount, gp: l.amount ? (l.units * nav / l.amount - 1) * 100 : 0}));
  return {rows, value, put: totPut, gain: value - totPut, gp: totPut ? (value / totPut - 1) * 100 : 0, units: totU, per, nav};
}

function spFuture(monthly, years, ratePct, start) {
  const i = ratePct / 100 / 12, n = Math.round(years * 12);
  const g = Math.pow(1 + i, n);
  const total = start * g + (i ? monthly * (g - 1) / i : monthly * n);
  const put = start + monthly * n;
  return {total, put, gain: total - put};
}

async function bioCheck(id) {
  await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{type: 'public-key', id: unb64(id), transports: ['internal', 'hybrid']}], userVerification: 'required', timeout: 60000}});
  return true;
}
let hiddenAt = 0;
function lockNow() {
  const L = getLock(); if (!L) return;
  document.body.classList.add('locked'); closeModal();
  $('#lock-bio').style.display = L.credId ? '' : 'none';
  $('#lock-err').textContent = ''; $('#lock-pin').value = '';
}
function unlock() { document.body.classList.remove('locked'); hiddenAt = 0; }
async function tryBio() {
  const L = getLock(); if (!L?.credId) return;
  try { await bioCheck(L.credId); unlock(); } catch (e) { $('#lock-err').textContent = 'No se pudo verificar. Prueba otra vez o usa el PIN.'; }
}
async function tryPin() {
  const L = getLock(); const v = $('#lock-pin').value.trim(); if (!v) return;
  if (await sha(v) === L.pinHash) unlock(); else { $('#lock-err').textContent = 'PIN incorrecto'; $('#lock-pin').value = ''; }
}
$('#lock-bio').addEventListener('click', tryBio);
$('#lock-pin-go').addEventListener('click', tryPin);
$('#lock-pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(); });
document.addEventListener('visibilitychange', () => {
  const L = getLock(); if (!L) return;
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > (L.minutes ?? 1) * 60000 && !document.body.classList.contains('locked')) { lockNow(); if (L.credId) tryBio(); }
});
function lockForm() {
  const L = getLock();
  openModal(`<h2>🔒 Bloqueo</h2>
    <p class="help">Pide Face ID (o tu PIN) para abrir la app. Es para que nadie curiosee si coge tu móvil desbloqueado; los datos siguen guardados en este móvil.</p>
    ${L ? `<p>✅ Activado${L.credId ? ' con Face ID y PIN' : ' con PIN'}.</p>
      <label class="field"><span>Bloquear al volver a la app después de</span><div class="inp"><select id="lk-min">${opts({'0':'Siempre', '1':'1 minuto', '5':'5 minutos', '15':'15 minutos', '60':'1 hora'}, String(L.minutes ?? 1))}</select></div></label>
      <div class="btnrow"><button class="btn ghost block" data-action="lock-test">Probar ahora</button></div>
      <div class="btnrow"><button class="btn danger block" data-action="lock-off">Desactivar bloqueo</button></div>`
    : `<p class="help">Primero elige un PIN de 4 a 8 números, por si Face ID falla.</p>
      ${txtField('PIN', 'lk-pin', '', 'password', 'inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"')}
      ${txtField('Repite el PIN', 'lk-pin2', '', 'password', 'inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"')}
      <p class="err small" id="lk-err" style="color:var(--bad)"></p>
      <button class="btn block" data-action="lock-on">Activar bloqueo</button>`}
    <div class="btnrow"><button class="btn ghost block" data-action="settings">Volver a ajustes</button></div>`);
  $('#lk-min')?.addEventListener('change', e => { const L2 = getLock(); L2.minutes = +e.target.value; setLock(L2); });
}
async function lockOn() {
  const a = val('lk-pin').trim(), b = val('lk-pin2').trim();
  if (!/^\d{4,8}$/.test(a)) { $('#lk-err').textContent = 'El PIN debe tener entre 4 y 8 números.'; return; }
  if (a !== b) { $('#lk-err').textContent = 'Los PIN no coinciden.'; return; }
  const L = {pinHash: await sha(a), minutes: 1, credId: null};
  if (await bioAvailable()) {
    try { L.credId = await bioRegister(); } catch (e) { $('#lk-err').textContent = 'No se pudo activar Face ID; quedará solo con PIN.'; }
  }
  setLock(L); lockForm();
}

  document.querySelectorAll('#tabs button').forEach(bt => bt.classList.toggle('on', bt.dataset.tab === tab));

  $('#subtitle').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

function syncBinds() {
  document.querySelectorAll('[data-bind]').forEach(el => {
    if (el === document.activeElement) return;
    const v = getPath(el.dataset.bind);
    if (el.type === 'checkbox') el.checked = !!v; else el.value = el.type === 'range' ? v : showNum(v);
  });
}

  openModal(`<h2>Venta o traspaso de ${esc(a.name)}</h2>

  const prev = () => {

    const cost = units ? fifoCost(a, units, val('s-date') || todayISO()) : null;
    const amt = units * at[1];
    $('#s-preview').innerHTML = units ? `≈ ${units.toLocaleString('es-ES', {maximumFractionDigits:4})} participaciones a ${at[1].toLocaleString('es-ES', {maximumFractionDigits:4})} €.${cost != null ? ` Ganancia estimada: <b class="${amt - cost >= 0 ? 'up' : 'down'}">${amt - cost >= 0 ? '+' : ''}${eur(amt - cost, 2)}</b>${$('#s-transfer').checked ? ' (no tributa por ser traspaso)' : ''}.` : ' Para calcular la ganancia, apunta tus compras o el dinero metido en total.'}` : '';
  };
  ['s-amount', 's-date', 's-all', 's-transfer'].forEach(i => { $('#' + i).addEventListener('input', prev); $('#' + i).addEventListener('change', prev); });
}
function buyForm(a) {
  const n = navOf(a.isin);
  openModal(`<h2>Compra de ${esc(a.name)}</h2>
    <p class="help">Pon cuánto has invertido y el día. La app calcula las participaciones con el precio de ese día${n ? '' : ' (todavía no hay precios: luego podrás corregirlas a mano)'}.</p>
    <div class="grid2">${txtField('Importe (€)', 'b-amount', S.plan.spMonthly && a.type === 'indexado' ? S.plan.spMonthly : '', 'number')}${txtField('Fecha', 'b-date', todayISO(), 'date')}</div>
    <p class="help" id="b-preview"></p>
    <div class="btnrow"><button class="btn" data-action="save-buy" data-id="${a.id}">Añadir compra</button><button class="btn ghost" data-action="close">Cancelar</button></div>
    <p class="note">MyInvestor puede usar el precio de uno o dos días después de la orden. Si quieres que cuadre al céntimo, copia luego el número exacto de participaciones en la ficha de la cuenta.</p>`);
  const prev = () => {
    const amt = numVal('b-amount'), at = navAt(a.isin, val('b-date') || todayISO());
    $('#b-preview').innerHTML = amt && at ? `≈ <b>${(amt / at[1]).toLocaleString('es-ES', {maximumFractionDigits:4})} participaciones</b> a ${at[1].toLocaleString('es-ES', {maximumFractionDigits:4})} € (precio del ${dateFmt(at[0])})` : '';
  };
  $('#b-amount').addEventListener('input', prev); $('#b-date').addEventListener('input', prev); prev();
}
function balForm() {
  openModal(`<h2>Revisión del mes 🗓️</h2>
    <p class="help">Abre la app de cada banco y copia el saldo que tienes ahora. Si una cuenta no ha cambiado, déjala como está.</p>
    ${S.accounts.map(a => a.isin && a.units > 0 && navOf(a.isin)
      ? txtField(`${esc(a.name)} <span class="muted">· participaciones (el saldo se calcula solo)</span>`, 'units-' + a.id, a.units, 'number')
      : txtField(`${esc(a.name)} <span class="muted">· ${esc(a.entity)}</span>`, 'bal-' + a.id, a.balance, 'number')).join('')}
    ${txtField('Fecha', 'bal-date', todayISO(), 'date')}
    <div class="btnrow"><button class="btn" data-action="save-bal">Guardar revisión</button><button class="btn ghost" data-action="close">Cancelar</button></div>`);
}
function projForm(p) {
  const isNew = !p;
  p = p || {name:'', status:'idea', notes:''};
  openModal(`<h2>${isNew ? 'Nuevo proyecto' : 'Proyecto'}</h2>
    ${txtField('Nombre', 'p-name', p.name)}
    <label class="field"><span>Estado</span><div class="inp"><select id="p-status">${opts(STATUS, p.status)}</select></div></label>
    <label class="field"><span>Notas · próximos pasos</span><div class="inp"><textarea id="p-notes">${esc(p.notes)}</textarea></div></label>
    <div class="btnrow"><button class="btn" data-action="save-proj" data-id="${p.id || ''}">Guardar</button><button class="btn ghost" data-action="close">Cancelar</button></div>
    ${isNew ? '' : `<div class="btnrow"><button class="btn danger block" data-action="del-proj" data-id="${p.id}">Eliminar proyecto</button></div>`}`);
}
function incForm() {
  const pm = Object.fromEntries(S.projects.map(p => [p.id, p.name]));
  openModal(`<h2>Registrar ingreso</h2>
    <label class="field"><span>Proyecto</span><div class="inp"><select id="i-proj">${opts(pm, S.projects.find(p => p.status === 'marcha')?.id)}</select></div></label>
    <div class="grid2">${txtField('Importe (€)', 'i-amount', '', 'number', 'inputmode="decimal" step="any"')}${txtField('Fecha', 'i-date', todayISO(), 'date')}</div>
    ${txtField('Concepto', 'i-concept', '', 'text', 'placeholder="Ej. Instalación domótica casa X"')}
    <div class="btnrow"><button class="btn" data-action="save-inc">Guardar</button><button class="btn ghost" data-action="close">Cancelar</button></div>`);
}
function settingsForm() {
  let theme = ''; try { theme = localStorage.getItem('patrimonio.theme') || ''; } catch (e) {}
  openModal(`<h2>Ajustes</h2>
    ${txtField('Tu nombre (para el saludo)', 's-name', S.ui.name)}
    <label class="field"><span>Tema</span><div class="inp"><select id="s-theme">${opts({'':'Automático', light:'Claro', dark:'Oscuro'}, theme)}</select></div></label>
    <div class="btnrow"><button class="btn ghost block" data-action="lock">🔒 Bloqueo con Face ID${getLock() ? ' · activado' : ''}</button></div>
    <h3 style="margin-top:14px">Copia de seguridad</h3>
    <p class="small muted" style="margin-top:0">Los datos se guardan solo en este dispositivo (clave <code>${KEY}</code>), así que el Hub puede copiarlos junto a tus otras PWAs.</p>
    <div class="btnrow"><button class="btn" data-action="export">Exportar JSON</button><button class="btn ghost" data-action="import">Importar JSON</button></div>
    <div class="btnrow"><button class="btn ghost block" data-action="show-welcome">Ver de nuevo la guía de inicio</button></div>
    <div class="btnrow" style="margin-top:14px"><button class="btn danger block" data-action="reset">Restablecer datos iniciales</button></div>
    <div class="btnrow"><button class="btn ghost block" data-action="close">Cerrar</button></div>`);
  $('#s-name').addEventListener('change', e => { S.ui.name = e.target.value.trim(); commit(); });
  $('#s-theme').addEventListener('change', e => {
    const v = e.target.value;
    try { v ? localStorage.setItem('patrimonio.theme', v) : localStorage.removeItem('patrimonio.theme'); } catch (er) {}
    applyTheme();
  });
}
function applyTheme() {
  let t = ''; try { t = localStorage.getItem('patrimonio.theme') || ''; } catch (e) {}
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0d1312' : '#0f766e';
}
applyTheme();

/* ---------- eventos ---------- */
function commit() { save(); render(); }
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { tab = tabBtn.dataset.tab; try { localStorage.setItem(TAB_KEY, tab); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  switch (act) {
    case 'close': closeModal(); break;
    case 'sp-years': S.plan.spYears = +el.dataset.v; save(); if (refresh) refresh(); break;
    case 'report': if (el.dataset.v) reportForm(el.dataset.v); break;
    case 'lock': lockForm(); break;
    case 'lock-on': lockOn(); break;
    case 'lock-off': if (confirm('¿Desactivar el bloqueo?')) { setLock(null); lockForm(); } break;
    case 'lock-test': lockNow(); tryBio(); break;
    case 'renta': rentaForm(el.dataset.v ? +el.dataset.v : null); break;
    case 'infl': inflForm(); break;
    case 'goto': tab = el.dataset.v; try { localStorage.setItem(TAB_KEY, tab); } catch (er) {} render(); window.scrollTo(0, 0); break;
    case 'show-welcome': S.ui.welcomeDone = false; tab = 'resumen'; closeModal(); commit(); break;
    case 'welcome-ok': S.ui.welcomeDone = true; commit(); break;
    case 'settings': settingsForm(); break;
    case 'add-acc': accForm(); break;
    case 'edit-acc': accForm(S.accounts.find(a => a.id === id)); break;
    case 'save-acc': {
      const name = val('f-name').trim();
      if (!name) { document.getElementById('f-name').focus(); return; }
      const inv = numVal('f-invested');
      const isin = val('f-isin').trim().toUpperCase().replace(/\s/g, '') || null;
      const data = {name, entity: val('f-entity').trim(), type: val('f-type'), bucket: val('f-bucket'), balance: numVal('f-balance') ?? 0, rate: numVal('f-rate') ?? 0, invested: inv, isin, units: isin ? numVal('f-units') : null};
      if (id) Object.assign(S.accounts.find(a => a.id === id), data); else S.accounts.push({id: uid(), lots: [], ...data});
      applyNavs(); closeModal(); commit(); break;
    }
    case 'del-acc':
      if (confirm('¿Eliminar esta cuenta? Las revisiones anteriores no se pierden.')) { S.accounts = S.accounts.filter(a => a.id !== id); closeModal(); commit(); }
      break;
    case 'lots': lotsForm(S.accounts.find(a => a.id === id)); break;
    case 'add-lot': {
      const a = S.accounts.find(x => x.id === id); const amt = numVal('l-amount'); const d = val('l-date') || todayISO();
      if (!a || !amt) { document.getElementById('l-amount')?.focus(); return; }
      const u = numVal('l-units') || lotUnits(a.isin, d, amt);
      (a.lots ||= []).push({id: uid(), date: d, amount: amt, units: u}); save(); render(); lotsForm(a, `Compra del ${dateFmt(d)} añadida.`); break;
    }
    case 'add-dca': {
      const a = S.accounts.find(x => x.id === id); const amt = numVal('d-amount'); const from = val('d-from'), to = val('d-to') || todayISO();
      const day = Math.min(28, Math.max(1, Math.round(numVal('d-day') || 1)));
      if (!a || !amt || !from) { document.getElementById('d-amount')?.focus(); return; }
      let [yy, mm] = from.split('-').map(Number); let n = 0;
      while (true) {
        const d = `${yy}-${pad(mm)}-${pad(day)}`;
        if (d > to) break;
        if (d >= from) { (a.lots ||= []).push({id: uid(), date: d, amount: amt, units: lotUnits(a.isin, d, amt)}); n++; }
        mm++; if (mm > 12) { mm = 1; yy++; }
        if (n > 600) break;
      }
      save(); render(); lotsForm(a, `${n} aportaciones de ${eur(amt)} añadidas.`); break;
    }
    case 'del-lot': { const a = S.accounts.find(x => x.id === id); a.lots = a.lots.filter(l => l.id !== el.dataset.lot); save(); render(); lotsForm(a); break; }
    case 'clear-lots': { const a = S.accounts.find(x => x.id === id); if (confirm('¿Borrar todas las compras apuntadas de este fondo?')) { a.lots = []; save(); render(); lotsForm(a); } break; }
    case 'sell': sellForm(S.accounts.find(a => a.id === id)); break;
    case 'save-sell': {
      const a = S.accounts.find(x => x.id === id); const date = val('s-date') || todayISO();
      const at = navAt(a.isin, date); if (!at) { alert('Aún no hay precios para este fondo.'); return; }
      const all = $('#s-all').checked; let units = all ? (a.units || 0) : (numVal('s-amount') || 0) / at[1];
      if (!units || units <= 0) { document.getElementById('s-amount')?.focus(); return; }
      units = Math.min(units, a.units || units); units = Math.round(units * 10000) / 10000;
      const amount = round2(units * at[1]);
      let cost = fifoCost(a, units, date); const gManual = numVal('s-gain');
      if (gManual != null) cost = amount - gManual;
      const transfer = $('#s-transfer').checked;
      (a.sales ||= []).push({id: uid(), date, units, amount, cost: cost != null ? round2(cost) : null, gain: cost != null ? round2(amount - cost) : null, transfer});
      a.units = Math.max(0, Math.round(((a.units || 0) - units) * 10000) / 10000);
      if (a.invested != null && cost != null) a.invested = Math.max(0, round2(a.invested - cost));
      const dest = S.accounts.find(x => x.id === val('s-dest'));
      if (dest) {
        const dn = dest.isin ? navAt(dest.isin, date) : null;
        if (dest.isin && dn) { dest.units = Math.round(((dest.units || 0) + amount / dn[1]) * 10000) / 10000; (dest.lots ||= []).push({id: uid(), date, amount, units: Math.round(amount / dn[1] * 10000) / 10000}); if (dest.invested != null) dest.invested = round2(dest.invested + (transfer && cost != null ? cost : amount)); }
        else dest.balance = round2(dest.balance + amount);
      }
      applyNavs(); closeModal(); commit(); break;
    }
    case 'buy': buyForm(S.accounts.find(a => a.id === id)); break;
    case 'save-buy': {
      const a = S.accounts.find(x => x.id === id); const amt = numVal('b-amount');
      if (!a || !amt) { document.getElementById('b-amount')?.focus(); return; }
      const at = navAt(a.isin, val('b-date') || todayISO());
      if (at) { a.units = Math.round(((a.units || 0) + amt / at[1]) * 10000) / 10000; (a.lots ||= []).push({id: uid(), date: val('b-date') || todayISO(), amount: amt, units: Math.round(amt / at[1] * 10000) / 10000}); }
      else a.balance = round2(a.balance + amt);
      if (a.invested != null) a.invested = round2(a.invested + amt);
      applyNavs(); closeModal(); commit(); break;
    }
    case 'update-bal': balForm(); break;
    case 'save-bal': {
      for (const a of S.accounts) { const u = numVal('units-' + a.id); if (u !== null) a.units = u; const v = numVal('bal-' + a.id); if (v !== null) a.balance = v; }
      applyNavs();
      const date = val('bal-date') || todayISO();
      S.snapshots = S.snapshots.filter(s => s.date !== date);
      S.snapshots.push(makeSnapshot(S, date));
      closeModal(); commit(); break;
    }
    case 'del-snap':
      if (confirm('¿Borrar la revisión del ' + dateFmt(el.dataset.date) + '?')) { S.snapshots = S.snapshots.filter(s => s.date !== el.dataset.date); commit(); }
      break;
    case 'down': S.house.downPct = +el.dataset.v; save(); syncBinds(); if (refresh) refresh(); break;
    case 'add-proj': projForm(); break;
    case 'edit-proj': projForm(S.projects.find(p => p.id === id)); break;
    case 'save-proj': {
      const name = val('p-name').trim();
      if (!name) { document.getElementById('p-name').focus(); return; }
      const data = {name, status: val('p-status'), notes: val('p-notes')};
      if (id) Object.assign(S.projects.find(p => p.id === id), data); else S.projects.push({id: uid(), ...data});
      closeModal(); commit(); break;
    }
    case 'del-proj':
      if (confirm('¿Eliminar el proyecto? Sus ingresos quedarán como "Sin proyecto".')) { S.projects = S.projects.filter(p => p.id !== id); closeModal(); commit(); }
      break;
    case 'add-inc': incForm(); break;
    case 'save-inc': {
      const amount = numVal('i-amount');
      if (!amount) { document.getElementById('i-amount').focus(); return; }
      S.income.push({id: uid(), projectId: val('i-proj'), amount, date: val('i-date') || todayISO(), concept: val('i-concept').trim()});
      closeModal(); commit(); break;
    }
    case 'del-inc': if (confirm('¿Borrar este ingreso?')) { S.income = S.income.filter(i => i.id !== id); commit(); } break;
    case 'check': { const c = S.checklist.find(c => c.id === id); if (c) { c.done = el.checked; commit(); } break; }
    case 'del-check': e.preventDefault(); S.checklist = S.checklist.filter(c => c.id !== id); commit(); break;
    case 'add-check': {
      const t = val('newCheck').trim(); if (!t) return;
      S.checklist.push({id: uid(), text: t, done: false}); commit();
      setTimeout(() => document.getElementById('newCheck')?.focus(), 0); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `patrimonio-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if (confirm('Se borrarán todos tus datos y se cargarán los iniciales. ¿Seguro?')) { S = defaults(); closeModal(); commit(); }
      break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newCheck') { e.preventDefault(); document.querySelector('[data-action="add-check"]')?.click(); } });
function onBind(e) {
  const el = e.target, path = el.dataset?.bind;
  if (!path) return;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else { v = parseFloat(String(el.value).replace(/\s/g, '').replace(',', '.')); if (!isFinite(v)) return; const mn = el.dataset.min ?? el.min; if (mn !== '' && mn != null && v < +mn) v = +mn; }
  setPath(path, v); save();
  if (refresh) refresh();
  syncBinds();
  const b = sums(); $('#subtitle').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
}
document.addEventListener('input', onBind);
document.addEventListener('change', e => { if (e.target.type === 'checkbox' && e.target.dataset.bind) onBind(e); });
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!Array.isArray(data.accounts)) throw new Error('formato');
      if (confirm('Esto sustituirá tus datos actuales por los del archivo. ¿Continuar?')) { S = normalize(data); closeModal(); commit(); }
    } catch (er) { alert('El archivo no es una copia válida de Patrimonio.'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

if (getLock()) lockNow();
render();
if (getLock()?.credId) tryBio();
loadNavs();
loadIpc();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { loadNavs(); loadIpc(); } });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
